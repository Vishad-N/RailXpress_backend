spring.application.name=backed
# server
server.port=8080

# H2 console (dev)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# H2 in-memory datasource (dev)
spring.datasource.url=jdbc:h2:mem:railxpressdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# local file upload directory
file.upload-dir=uploads

# allow frontend dev server origin to call APIs
spring.mvc.cors.allowed-origins=https://rail-xpress-frontend-tf3h.vercel.app/

